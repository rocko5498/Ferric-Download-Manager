[package]
name        = "ferric-extract"
description = "Media extraction: native IEs + yt-dlp engine integration"
publish     = false

version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
# Product default: integrate system yt-dlp for full site coverage.
# Disable with --no-default-features for pure-native CI if needed.
default = ["ytdlp-subprocess"]
# Shell out to official yt-dlp binary (safe argv). Ferric still owns downloads.
ytdlp-subprocess = ["dep:which", "dep:tokio"]

[dependencies]
ferric-common = { workspace = true }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
url         = { workspace = true }
scraper     = { workspace = true }
regex       = { workspace = true }
m3u8-rs     = { workspace = true }
quick-xml   = { workspace = true }
tempfile    = "3"
which       = { workspace = true, optional = true }
tokio       = { workspace = true, features = ["process", "time", "io-util", "rt"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[lints]
workspace = true
