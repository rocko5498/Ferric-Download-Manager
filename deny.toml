# deny.toml — cargo-deny config (S1 security)
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Transitive-only / no fix yet. Revisit when upstreams move.
ignore = [
  # postcard → heapless → atomic-polyfill (IPC serde)
  { id = "RUSTSEC-2023-0089", reason = "transitive via postcard/heapless; no upgrade path" },
  # assorted unmaintained transitive proc-macro/util crates
  { id = "RUSTSEC-2025-0057", reason = "transitive fxhash; unmaintained" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "OpenSSL",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
