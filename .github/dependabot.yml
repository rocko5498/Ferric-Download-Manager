version: 2
updates:
  # Rust crates: one pull request a month for patch releases, separate ones for anything bigger.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      rust-patch-updates:
        update-types:
          - patch
    # The cxx bridge must move together with the cxx-qt release that generates its C++ side, or the
    # Qt interface stops linking (cargo check does not notice). They are updated by hand with cxx-qt.
    ignore:
      - dependency-name: cxx
      - dependency-name: cxx-build
      - dependency-name: cxxbridge-flags
      - dependency-name: cxxbridge-macro
      - dependency-name: cxxbridge-cmd

  # Browser extension. React and TypeScript majors are held back until the extension framework
  # (Plasmo) supports them: React 19 and TypeScript 7 need their own migration.
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-patch-updates:
        update-types:
          - patch
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # No GitHub Actions entry: workflows only start by hand (see CONTRIBUTING.md).
