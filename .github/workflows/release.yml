name: Release

# Builds the Windows installer and zip on a GitHub-hosted Windows machine, so nothing has to be compiled or
# run on a developer's PC. The result is a DRAFT release: it becomes public only when its Publish button is
# pressed. Start it from Actions > Release > Run workflow, or by pushing a tag such as v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FERRIC_OFFICIAL_BUILD: "1"
  FERRIC_EXTENSION_ID: ${{ vars.FERRIC_EXTENSION_ID }}
  FERRIC_FIREFOX_EXTENSION_ID: ${{ vars.FERRIC_FIREFOX_EXTENSION_ID }}
  QT_VERSION: "6.8.3"
  QT_ARCH: win64_msvc2022_64

jobs:
  windows:
    name: Windows installer and zip
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $v) { throw "no version in Cargo.toml" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Verify release metadata
        shell: pwsh
        run: |
          if (-not $env:FERRIC_EXTENSION_ID) { throw "Set the repository variable FERRIC_EXTENSION_ID (Settings > Secrets and variables > Actions > Variables)" }
          if (-not $env:FERRIC_FIREFOX_EXTENSION_ID) { throw "Set the repository variable FERRIC_FIREFOX_EXTENSION_ID" }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # qtdeclarative ships inside the base desktop install for Qt 6.8; listing it as a module fails the install.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qtshadertools
          cache: true

      # The extension goes first: the packaging script copies its build into the release folder.
      - name: Build the browser extension
        shell: pwsh
        working-directory: extension
        run: |
          npm ci
          npm run build
          npm test

      # Signs the extension with the Ferric key (a repository secret) so the installer can offer it to the
      # browsers. Without the secret this is skipped and the installer simply does not offer it.
      - name: Is the extension key available?
        id: key
        shell: pwsh
        env:
          KEY: ${{ secrets.FERRIC_EXTENSION_KEY }}
        run: |
          if ($env:KEY) { "present=true" >> $env:GITHUB_OUTPUT } else { Write-Host "No FERRIC_EXTENSION_KEY secret: the installer will not offer the extension to the browsers." }

      - name: Pack the extension for Chrome and Edge
        if: steps.key.outputs.present == 'true'
        shell: pwsh
        env:
          FERRIC_EXTENSION_KEY: ${{ secrets.FERRIC_EXTENSION_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP "ferric-extension-key.pem"
          try {
            Set-Content $key $env:FERRIC_EXTENSION_KEY -NoNewline
            .\scripts\pack-extension.ps1 -Key $key -Out extension\build\chrome-mv3-prod.crx -UpdateUrl "https://clients2.google.com/service/update2/crx"
            .\scripts\pack-extension.ps1 -Key $key -Out extension\build\chrome-mv3-prod-edge.crx -UpdateUrl "https://edge.microsoft.com/extensionwebstorebase/v1/crx"
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }

      - name: Build ferric-qt, ferricd and ferric-host
        run: cargo build --release -p ferric-qt -p ferricd -p ferric-host

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package (zip and installer)
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Release -OutputDir release

      # Install it the way a user would, check it, remove it again. Only this disposable runner is touched.
      - name: Test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "Ferric-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "the installer was not built" }
          $dir = "$env:RUNNER_TEMP\ferric-installed"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in "ferric-qt.exe","ferricd.exe","ferric-host.exe","Qt6Core.dll","extension\manifest.json") {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          & "$dir\ferric-host.exe" --status
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "Ferric.lnk"
          if (-not (Test-Path $desktop)) { throw "no desktop shortcut after install" }
          # The extension offer: Chrome's key is also read by Brave (measured), Edge has its own.
          $offered = @(
            @{ key = "HKCU:\Software\Google\Chrome\Extensions\gepkkfjfgdcgelcnejpikdeanggknbjo"; file = "Ferric.crx" },
            @{ key = "HKCU:\Software\Microsoft\Edge\Extensions\gepkkfjfgdcgelcnejpikdeanggknbjo"; file = "Ferric-edge.crx" }
          )
          $packed = Test-Path "$dir\extension\Ferric.crx"
          if ("${{ steps.key.outputs.present }}" -eq "true" -and -not $packed) { throw "the key is set but the installer carries no packed extension" }
          if ($packed) {
            foreach ($o in $offered) {
              $v = Get-ItemProperty $o.key -ErrorAction SilentlyContinue
              if (-not $v) { throw "extension not offered: missing $($o.key)" }
              if (-not (Test-Path $v.path) -or -not $v.version) { throw "bad offer at $($o.key): $($v.path) $($v.version)" }
            }
          }
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          $u = Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          if (Test-Path $desktop) { throw "desktop shortcut left behind after uninstall" }
          foreach ($o in $offered) { if (Test-Path $o.key) { throw "extension offer left behind after uninstall: $($o.key)" } }

      - name: Name the files and write checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\Ferric-win64.zip "out\Ferric-$v-win-x64.zip"
          Copy-Item (Get-ChildItem dist -Filter "Ferric-Setup-*.exe" | Select-Object -First 1).FullName "out\Ferric-Setup-$v.exe"
          Copy-Item extension\build\chrome-mv3-prod -Destination "out\ext" -Recurse
          Compress-Archive -Path "out\ext\*" -DestinationPath "out\ferric-extension-$v.zip"
          Remove-Item "out\ext" -Recurse -Force
          Get-ChildItem out -File | ForEach-Object {
            $h = Get-FileHash -Algorithm SHA256 $_.FullName
            "$($h.Hash.ToLowerInvariant())  $($_.Name)" | Out-File -Append -Encoding ascii out\SHA256SUMS.txt
          }
          Get-Content out\SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ferric-windows
          path: out/*
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: ferric-windows
          path: out

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ferric ${{ needs.windows.outputs.version }}
          draft: true
          prerelease: ${{ contains(needs.windows.outputs.version, '-') }}
          files: out/*
          body: |
            Unsigned build. Windows SmartScreen may warn the first time you run it.
            Check the download against `SHA256SUMS.txt`.

            - `Ferric-Setup-*.exe`: one-click installer (current user, no administrator rights)
            - `Ferric-*-win-x64.zip`: the same files without an installer
            - `ferric-extension-*.zip`: the browser extension (load it unpacked)
